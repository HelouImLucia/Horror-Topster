<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu cuenta · Horror Topster</title>
    <link rel="icon" href="img/fantasma.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="acceso">
        <section class="acceso-panel">
            <form class="acceso-form" id="formRegistro" novalidate>
                <h1 class="acceso-titulo">Crea tu cuenta</h1>
                <p class="acceso-bajada">Entra al Archivo del Terror y empieza a crear tu Top 10 personal. Gratis y a tu manera.</p>

                <div class="campo">
                    <label class="campo-etiqueta" for="nombre">Nombre de usuario</label>
                    <input class="campo-input" id="nombre" type="text" placeholder="Nombre" autocomplete="username">
                </div>

                <div class="campo">
                    <label class="campo-etiqueta" for="email">Correo electrónico</label>
                    <input class="campo-input" id="email" type="email" placeholder="tu@correo.com" autocomplete="email">
                    <p class="email-mensaje" id="email-mensaje" role="alert"></p>
                </div>

                <div class="campo">
                    <label class="campo-etiqueta" for="password">Contraseña</label>
                    <div class="campo-contrasena">
                        <input class="campo-input" id="password" type="password" placeholder="Crea una contraseña" autocomplete="new-password">
                        <button class="boton-ojo" type="button" data-input="password" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="ojo-tachado" d="M4 4l16 16"/></svg>
                        </button>
                    </div>
                    <p class="campo-ayuda">Usa al menos 8 caracteres, una letra y un número.</p>
                </div>

                <div class="campo">
                    <label class="campo-etiqueta" for="confirmar">Confirmar contraseña</label>
                    <div class="campo-contrasena">
                        <input class="campo-input" id="confirmar" type="password" placeholder="Repite tu contraseña" autocomplete="new-password">
                        <button class="boton-ojo" type="button" data-input="confirmar" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="ojo-tachado" d="M4 4l16 16"/></svg>
                        </button>
                    </div>
                </div>

                <label class="casilla">
                    <input id="terminos" type="checkbox">
                    <span>Acepto los <em>Términos y condiciones</em> y la <em>Política de privacidad</em>.</span>
                </label>

                <button class="boton-acceso" id="btnCrear" type="submit">
                    <span id="textoCrear">Crear cuenta</span>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
                <p class="acceso-mensaje" id="mensaje" role="alert"></p>

                <a class="acceso-enlace" href="login.html">Inicia sesión</a>
            </form>
        </section>

        <div class="acceso-imagen" aria-hidden="true"></div>
    </main>

    <script type="module" src="js/registro.js"></script>
</body>
</html>
