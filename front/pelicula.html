<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Película · Horror Topster</title>
    <link rel="icon" href="img/fantasma.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="cabezal">
        <a class="cabezal-logo" href="index.html">
            <img src="img/fantasma.svg" alt="" width="44" height="44">
            <span class="cabezal-marca">Horror Topster</span>
        </a>
        <nav class="cabezal-nav">
            <a class="cabezal-enlace" href="mis-resenas.html">Mis reseñas</a>
            <button class="cabezal-salir" id="btnCerrarSesion" type="button">Cerrar sesión</button>
        </nav>
    </header>

    <main class="contenedor">
        <article class="ficha">
            <div class="ficha-cabeza">
                <a class="volver" href="index.html#archivo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                    Volver al Archivo del Terror
                </a>
                <h1 class="ficha-titulo extendida" id="fichaTitulo"></h1>
            </div>

            <div class="ficha-cuerpo">
                <div class="ficha-poster" id="fichaPoster"></div>

                <div class="ficha-info">
                    <p class="ficha-datos">
                        <span id="fichaAnio"></span>
                        <span aria-hidden="true">/</span>
                        <span id="fichaDuracion"></span>
                        <span class="etiqueta" id="fichaTipo"></span>
                    </p>

                    <h2 class="ficha-frase serif" id="fichaFrase"></h2>
                    <p class="ficha-descripcion" id="fichaDescripcion"></p>

                    <dl class="ficha-creditos">
                        <div>
                            <dt>Dirección</dt>
                            <dd id="fichaDireccion"></dd>
                        </div>
                        <div>
                            <dt>Guion</dt>
                            <dd id="fichaGuion"></dd>
                        </div>
                        <div>
                            <dt>Reparto principal</dt>
                            <dd id="fichaReparto"></dd>
                        </div>
                    </dl>

                    <button class="boton-top" id="btnTop" type="button" disabled>Añadir a Mi Top 10</button>
                </div>
            </div>
        </article>

        <section class="resenas">
            <div class="resenas-cabeza">
                <div>
                    <h2 class="serif">Reseñas de usuarios</h2>
                    <p>Comparte tu opinión y lee las de otros fans.</p>
                </div>

                <div class="filtro">
                    <button class="filtro-boton" id="btnFiltro" type="button" aria-expanded="false" aria-controls="menuFiltro">
                        Filtrar
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <ul class="filtro-menu" id="menuFiltro">
                        <li><button type="button" data-orden="todas" class="activo">Todas las reseñas</button></li>
                        <li><button type="button" data-orden="recientes">Más recientes</button></li>
                        <li><button type="button" data-orden="altas">Más altas</button></li>
                        <li><button type="button" data-orden="bajas">Más bajas</button></li>
                    </ul>
                </div>
            </div>

            <form class="resena-form" id="formResena">
                <div class="resena-form-cabeza">
                    <span class="avatar avatar-propio" aria-hidden="true"></span>
                    <h3 id="tituloFormResena">Comparte una terrorífica reseña con los demás.</h3>
                </div>

                <label class="visualmente-oculto" for="textoResena">Tu reseña</label>
                <textarea id="textoResena" maxlength="500" placeholder="Escribe aquí..."></textarea>

                <div class="resena-form-pie">
                    <span class="resena-contador" id="contadorResena">0/500</span>

                    <label class="selector-puntaje">
                        Puntaje
                        <select id="puntajeResena">
                            <option value="5">5/5</option>
                            <option value="4">4/5</option>
                            <option value="3">3/5</option>
                            <option value="2">2/5</option>
                            <option value="1">1/5</option>
                        </select>
                    </label>

                    <button class="boton-pill boton-pill-borde" id="btnCancelarResena" type="button" style="display: none;">Cancelar</button>
                    <button class="boton-pill" id="btnPublicar" type="submit">Publicar reseña</button>
                </div>
            </form>

            <p class="resenas-estado" id="estadoResenas"></p>
            <ul class="resenas-lista" id="listaResenas"></ul>
        </section>
    </main>

    <footer class="pie">
        <p class="pie-marca"><span class="serif">Horror</span> <span class="extendida">Topster</span></p>
        <p class="pie-creditos">Programación II, Lucía Pérez y Lucía Pita</p>
    </footer>

    <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

    <div class="modal-fondo" id="modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
            <div class="modal-cabeza">
                <img class="modal-logo" src="img/fantasma.svg" alt="">
                <button class="modal-cerrar" id="modalCerrar" type="button" aria-label="Cerrar">&times;</button>
            </div>
            <h2 class="modal-titulo" id="modalTitulo"></h2>
            <p class="modal-texto" id="modalTexto"></p>
            <div class="modal-botones">
                <button class="boton-modal boton-modal-borde" id="modalCancelar" type="button">Cancelar</button>
                <button class="boton-modal" id="modalAceptar" type="button">Aceptar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/pelicula.js"></script>
</body>
</html>
